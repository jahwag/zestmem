services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0 # pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:ad950d30878eceb72aaf32024d26fa2b1d04a75304fa0b4776b49aa1941fea07 # cpu-1.8
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
      - --revision
      - 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - --port
      - "80"
    volumes:
      - tei-cache:/data
    restart: unless-stopped

  memory:
    image: ghcr.io/bytelope/zestmem:0
    environment:
      DATABASE_URL: postgres://memory@postgres:5432/memory?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TEI_URL: http://tei
      TEI_CONCURRENCY: "4"
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_BURST: "20"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 # 2.10.2-alpine
    environment:
      MEMORY_DOMAIN: ${MEMORY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - memory
    restart: unless-stopped

  backup:
    image: ghcr.io/bytelope/zestmem-backup:0
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: memory
      PGUSER: memory
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      GITHUB_BACKUP_REPOSITORY: ${GITHUB_BACKUP_REPOSITORY:-}
      GITHUB_BACKUP_RETENTION_DAYS: ${GITHUB_BACKUP_RETENTION_DAYS:-30}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
    volumes:
      - backups:/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  tei-cache:
  caddy-data:
  backups:
