services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f # pg17
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d # cpu-1.8
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
      - --revision
      - 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - --port
      - "80"
    volumes:
      - tei-cache:/data
    restart: unless-stopped

  memory:
    image: ghcr.io/jahwag/zestmem:0.10.3 # x-release-please-version
    environment:
      DATABASE_URL: postgres://memory@postgres:5432/memory?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TEI_URL: http://tei
      TEI_CONCURRENCY: "4"
      RATE_LIMIT_PER_MINUTE: "120"
      RATE_LIMIT_BURST: "20"
      ZESTMEM_STARTUP_CUE_APPROVALS: ${ZESTMEM_STARTUP_CUE_APPROVALS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM:-sub}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      MCP_RESOURCE_URI: ${MCP_RESOURCE_URI:-}
      MCP_RESOURCE_METADATA_URL: ${MCP_RESOURCE_METADATA_URL:-}
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:-}
      CONSOLE_ASSERTION_ISSUER: ${CONSOLE_ASSERTION_ISSUER:-}
      CONSOLE_ASSERTION_AUDIENCE: ${CONSOLE_ASSERTION_AUDIENCE:-}
      CONSOLE_ASSERTION_JWKS_URL: ${CONSOLE_ASSERTION_JWKS_URL:-}
      CONSOLE_ASSERTION_SUBJECT_CLAIM: ${CONSOLE_ASSERTION_SUBJECT_CLAIM:-sub}
      CONSOLE_ASSERTION_REQUIRED_ROLE: ${CONSOLE_ASSERTION_REQUIRED_ROLE:-}
      CONSOLE_ASSERTION_HEADER: ${CONSOLE_ASSERTION_HEADER:-Cf-Access-Jwt-Assertion}
      CONSOLE_OIDC_ISSUER: ${CONSOLE_OIDC_ISSUER:-}
      CONSOLE_OIDC_CLIENT_ID: ${CONSOLE_OIDC_CLIENT_ID:-}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:-}
      CONSOLE_OIDC_CLIENT_SECRET_FILE: ${CONSOLE_OIDC_CLIENT_SECRET_FILE:-}
      CONSOLE_OIDC_REDIRECT_URL: ${CONSOLE_OIDC_REDIRECT_URL:-}
      CONSOLE_OIDC_SCOPES: ${CONSOLE_OIDC_SCOPES:-}
      CONSOLE_OIDC_SUBJECT_CLAIM: ${CONSOLE_OIDC_SUBJECT_CLAIM:-sub}
      CONSOLE_OIDC_REQUIRED_ROLE: ${CONSOLE_OIDC_REQUIRED_ROLE:-}
      CONSOLE_AUTH_RATE_LIMIT_PER_MINUTE: ${CONSOLE_AUTH_RATE_LIMIT_PER_MINUTE:-30}
      CONSOLE_AUTH_RATE_LIMIT_BURST: ${CONSOLE_AUTH_RATE_LIMIT_BURST:-10}
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  caddy:
    image: docker.io/library/caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9 # 2.10.2-alpine
    environment:
      MEMORY_DOMAIN: ${MEMORY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - memory
    restart: unless-stopped

  backup:
    image: ghcr.io/jahwag/zestmem-backup:0.10.3 # x-release-please-version
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: memory
      PGUSER: memory
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      GITHUB_BACKUP_REPOSITORY: ${GITHUB_BACKUP_REPOSITORY:-}
      GITHUB_BACKUP_RETENTION_DAYS: ${GITHUB_BACKUP_RETENTION_DAYS:-30}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
    volumes:
      - backups:/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  tei-cache:
  caddy-data:
  backups:
