name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo 'PR title must be a supported Conventional Commit title.' >&2
            exit 1
          fi
