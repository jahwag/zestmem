name: Security
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.10', cache: true }
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -json ./... > govulncheck.json
      # Pinned Trivy image: trivy-action installs from get.trivy.dev, which
      # stopped resolving in November 2026.
      - name: Scan repository for vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          fs --severity HIGH,CRITICAL --exit-code 1
          --format sarif --output trivy-fs.sarif .
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source /repo --no-banner --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            govulncheck.json
            trivy-fs.sarif
            gitleaks.sarif
          retention-days: 7
