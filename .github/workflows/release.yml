name: Release artifacts
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a canonical release and its tag ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "jahwag/zestmem" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("release is a draft") else . end'
  native-a:
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.RELEASE_TAG }}', fetch-depth: 0, persist-credentials: false }
      - name: Normalize archive input timestamps
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          touch --date="@$epoch" LICENSE README.md
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25.13', cache: false }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { distribution: goreleaser, version: v2.12.7, args: release --clean }
      - run: sh scripts/verify-archive-contents.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: native-a, path: 'dist/*', retention-days: 3 }
  native-b:
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.RELEASE_TAG }}', fetch-depth: 0, persist-credentials: false }
      - name: Normalize archive input timestamps
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          touch --date="@$epoch" LICENSE README.md
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.25.13', cache: false }
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { distribution: goreleaser, version: v2.12.7, args: release --clean }
      - run: sh scripts/verify-archive-contents.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: native-b, path: 'dist/*', retention-days: 3 }
  verify-native:
    needs: [native-a, native-b]
    runs-on: ubuntu-24.04
    outputs:
      subjects: ${{ steps.subjects.outputs.value }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: native-a, path: a }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: native-b, path: b }
      - name: Require byte-identical archive manifests
        run: diff -u a/checksums.txt b/checksums.txt
      - id: subjects
        run: echo "value=$(base64 -w0 a/checksums.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-native
          path: |
            a/*.tar.gz
            a/*.zip
            a/checksums.txt
            a/*.spdx.json
          retention-days: 3
  provenance:
    needs: verify-native
    permissions:
      actions: read
      id-token: write
      contents: write
    # Required full version tag: see docs/releasing.md for the verifier-driven exception.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.verify-native.outputs.subjects }}
      upload-assets: false
      upload-tag-name: ${{ github.event.release.tag_name || inputs.tag }}
      private-repository: true
  publish-native:
    needs: [verify-native, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: verified-native, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: multiple.intoto.jsonl, path: dist }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release blobs
        working-directory: dist
        run: |
          for artifact in *.tar.gz *.zip checksums.txt; do
            [ -f "$artifact" ] || continue
            cosign sign-blob --yes --bundle "${artifact}.bundle" "$artifact"
          done
      - name: Upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
  images:
    needs: publish-native
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zestmem
            file: Containerfile
          - image: zestmem-backup
            file: Containerfile.backup
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ env.RELEASE_TAG }}', persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}' }
      - id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          IMAGE: ghcr.io/jahwag/${{ matrix.image }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          rest="${version#*.}"
          echo "minor=${version%%.*}.${rest%%.*}" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "created=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:sha-${{ steps.vars.outputs.revision }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            REVISION=${{ steps.vars.outputs.revision }}
            CREATED=${{ steps.vars.outputs.created }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}'
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
      - name: Preserve image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.vars.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Promote verified aliases
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.vars.outputs.image }}
          MAJOR: ${{ steps.vars.outputs.major }}
          MINOR: ${{ steps.vars.outputs.minor }}
        run: |
          source="${IMAGE}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE}:${MAJOR}" "$source"
          docker buildx imagetools create --tag "${IMAGE}:${MINOR}" "$source"
          docker buildx imagetools create --tag "${IMAGE}:latest" "$source"
