version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-modules: { patterns: ["*"] }
    commit-message: { prefix: "build(deps)" }
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "ci(deps)" }
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups:
      container-bases: { patterns: ["*"] }
    ignore:
      # Go 1.27 ships Unicode 17; stay on 1.26 until a migration refreshes
      # zestmem_use_when_is_safe (see migrations/integration_test.go).
      - dependency-name: library/golang
        versions: [">= 1.27"]
    commit-message: { prefix: "build(deps)" }
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose-images: { patterns: ["*"] }
    commit-message: { prefix: "build(deps)" }
    cooldown:
      default-days: 7
