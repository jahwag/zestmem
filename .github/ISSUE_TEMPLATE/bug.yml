name: Bug report
description: Report a reproducible ZestMem defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, inputs, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: OS, architecture, container runtime, deployment shape, and redacted logs.
